<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Lili — sem conexão</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #030202;
        color: #f4f1f1;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.55;
        color: #b9b2b2;
      }
      button {
        border: 0;
        border-radius: 0.5rem;
        padding: 0.7rem 1.6rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: #fff;
        background: #e2312f;
        cursor: pointer;
      }
      button:hover {
        background: #c92725;
      }
      small {
        display: block;
        margin-top: 1.25rem;
        color: #756e6e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Não foi possível abrir a Lili</h1>
      <p>
        O aplicativo carrega a versão publicada do site e não conseguiu
        alcançá-la. Verifique sua conexão e tente de novo.
      </p>
      <button id="retry" type="button">Tentar de novo</button>
      <small>Se o problema continuar, o site pode estar fora do ar.</small>
    </main>
    <script>
      // `janjaDesktop` vem do preload. Sem ele — o que não deveria acontecer —
      // o botão apenas recarrega esta página, em vez de ficar inerte.
      document.getElementById("retry").addEventListener("click", () => {
        if (window.janjaDesktop?.retry) window.janjaDesktop.retry();
        else location.reload();
      });
    </script>
  </body>
</html>
