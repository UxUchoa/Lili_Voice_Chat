name: CI

on:
  push:
  pull_request:

# O download do Electron são ~150 MB que nenhum job de CI usa: só o release
# empacota o desktop.
env:
  LILI_SKIP_ELECTRON_DOWNLOAD: "true"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Valores de fachada, com o formato de produção: exercitam o validador de
      # ambiente e o caminho que monta a CSP restrita a partir das origens
      # reais. Um build sem eles nunca passaria por esse código.
      - name: Build da web (caminho de produção)
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_LIVEKIT_URL: wss://ci-placeholder.livekit.cloud
          LILI_STRICT_ENV: "true"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase test db
      - run: npx supabase db lint --local --schema public --level warning

