name: CI

on:
  push:
  pull_request:

# O download do Electron são ~150 MB que nenhum job de CI usa: só o release
# empacota o desktop.
env:
  JANJA_SKIP_ELECTRON_DOWNLOAD: "true"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Valores de fachada, com o formato de produção: exercitam o validador de
      # ambiente e o caminho que monta a CSP restrita a partir das origens
      # reais. Um build sem eles nunca passaria por esse código.
      - name: Build da web (caminho de produção)
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_LIVEKIT_URL: wss://ci-placeholder.livekit.cloud
          JANJA_STRICT_ENV: "true"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase test db
      - run: npx supabase db lint --local --schema public --level warning

  openmls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # `vendor/openmls` não é versionado: são 19 MB de código de terceiro mais
      # o `target/` que passa de 1 GB depois do primeiro build. O script clona
      # o commit fixado e aplica patches/openmls-wasm.patch.
      - run: npm run vendor:openmls
      - run: cargo test --manifest-path vendor/openmls/openmls-wasm/Cargo.toml
