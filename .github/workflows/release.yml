name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}
      VITE_FORCE_TURN: ${{ vars.VITE_FORCE_TURN }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      VITE_TENOR_API_KEY: ${{ vars.VITE_TENOR_API_KEY }}
      # Endereço público do site. No instalador ele não é opcional: a página
      # vive em file://, e sem isto o convite copiado e o link de recuperação
      # de senha não apontam para lugar nenhum.
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      # Recusa URL local, chave de service role e qualquer segredo com prefixo
      # VITE_. É o mesmo validador que roda na Vercel e no CI.
      LILI_STRICT_ENV: "true"
      # Caminho relativo nos assets e VITE_SITE_URL obrigatória. Sem isto o
      # `/assets/...` do Vite vira `file:///C:/assets/...` e o aplicativo
      # instalado abre uma janela em branco, sem erro no console.
      LILI_DESKTOP_BUILD: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Resolve signing mode
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Configure CSC_LINK e CSC_KEY_PASSWORD juntos, ou deixe ambos vazios."
          }
          "RELEASE_SIGNED=$($hasCertificate.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not $hasCertificate) {
            Write-Warning "Publicando instalador sem Authenticode; o Windows SmartScreen exibirá um aviso."
          }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Falha antes de empacotar se a configuração pública estiver ausente ou
      # errada: um instalador assinado sem endereço de site é pior que nenhum.
      - run: node scripts/check-web-env.mjs
        env:
          LILI_DESKTOP_BUILD: "true"
          LILI_STRICT_ENV: "true"
      # A casca precisa levar a tela de indisponibilidade e a ponte do preload;
      # sem elas um site fora do ar deixa a janela em branco.
      - run: npx electron scripts/test-desktop-smoke.mjs
      - name: Build and publish NSIS release
        shell: pwsh
        run: |
          $repository = $env:GITHUB_REPOSITORY.Split('/')[1]
          $siteUrl = (& node scripts/check-web-env.mjs --print-site-url)
          if ([string]::IsNullOrWhiteSpace($siteUrl)) {
            throw "VITE_SITE_URL nao resolveu: o pacote abriria sem endereco."
          }
          # `--publish never`: quem envia e o passo de upload, com o `gh`.
          # Com `always`, o electron-builder sobe cada artefato por um
          # publisher proprio e os dois tentam criar a release ao mesmo tempo
          # quando ela ainda nao existe. Um cria, o outro perde a corrida - e o
          # upload do instalador e do latest.yml morre junto, sem erro e com
          # exit 0. Foi o que deixou a 0.1.3 no ar so com o blockmap.
          #
          # A configuracao de publish continua aqui porque e dela que sai o
          # `app-update.yml` embarcado no pacote: sem ele o aplicativo
          # instalado nao sabe onde procurar atualizacao.
          $arguments = @(
            'electron-builder', '--win', 'nsis', '--publish', 'never',
            "--config.extraMetadata.liliSiteUrl=$siteUrl",
            '--config.publish.provider=github',
            "--config.publish.owner=$env:GITHUB_REPOSITORY_OWNER",
            "--config.publish.repo=$repository",
            '--config.publish.releaseType=release'
          )
          if ($env:RELEASE_SIGNED -eq 'true') {
            $arguments += '--config.forceCodeSigning=true'
          }
          & npx.cmd @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged shell
        shell: pwsh
        env:
          LILI_SMOKE_ASAR: resources/app.asar
        run: |
          $unpacked = Get-ChildItem -Recurse -Directory -Filter 'win-unpacked' |
            Select-Object -First 1
          if (-not $unpacked) { throw "win-unpacked nao foi gerado." }
          $env:LILI_SMOKE_ASAR = Join-Path $unpacked.FullName 'resources/app.asar'
          & npx.cmd electron scripts/test-desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw "O app.asar nao passou no teste de fumaca." }
      - name: Verify installer and update metadata
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          $blockmap = Get-ChildItem release -File -Filter '*.exe.blockmap' | Select-Object -First 1
          if (-not $blockmap) { throw "NSIS blockmap was not generated." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($env:RELEASE_SIGNED -eq 'true' -and $signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.Status)"
          }
          if ($env:RELEASE_SIGNED -ne 'true' -and $signature.Status -eq 'Valid') {
            Write-Warning "O instalador saiu assinado mesmo sem o modo de assinatura explícito."
          } elseif ($env:RELEASE_SIGNED -ne 'true') {
            Write-Warning "Instalador sem Authenticode ($($signature.Status))."
          }
          if (-not (Test-Path -LiteralPath 'release/latest.yml')) {
            throw "electron-updater metadata release/latest.yml is missing."
          }
          $stream = [IO.File]::OpenRead($installer.FullName)
          try {
            $algorithm = [Security.Cryptography.SHA256]::Create()
            try {
              $hash = ([BitConverter]::ToString($algorithm.ComputeHash($stream))).Replace('-', '').ToLowerInvariant()
            } finally { $algorithm.Dispose() }
          } finally { $stream.Dispose() }
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'release\SHA256SUMS.txt'),
            "$hash *$($installer.Name)`n",
            (New-Object Text.UTF8Encoding $false)
          )
          # O corpo da release sai de docs/CHANGELOG.md. O script sai com
          # codigo 1 quando a versao nao tem secao la, e a publicacao para
          # aqui: release sem notas e release que ninguem sabe o que mudou.
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = & node scripts/release-notes.mjs $version
          if ($LASTEXITCODE -ne 0) {
            throw "Sem notas de versao para $version em docs/CHANGELOG.md."
          }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText(
            $notesFile,
            ($notes -join "`n"),
            (New-Object Text.UTF8Encoding $false)
          )
          # A release e criada aqui, uma vez, antes de qualquer upload.
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --title $version `
              --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel criar a release." }
          }
          else {
            # Reexecucao do workflow sobre uma release ja criada: as notas
            # acompanham o changelog em vez de ficarem na versao antiga.
            gh release edit $env:GITHUB_REF_NAME --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel atualizar as notas." }
          }
          gh release upload $env:GITHUB_REF_NAME `
            $installer.FullName `
            $blockmap.FullName `
            release/latest.yml `
            release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "O upload dos artefatos falhou." }

          # O que o updater precisa encontrar publicado. Sem esta conferencia a
          # release pode ficar incompleta e so o usuario descobre, semanas
          # depois, que a atualizacao nunca chegou.
          $published = (gh release view $env:GITHUB_REF_NAME --json assets `
            --jq '.assets[].name') -split "`n"
          foreach ($required in @($installer.Name, 'latest.yml')) {
            if ($published -notcontains $required) {
              throw "A release ficou sem $required."
            }
          }
